# Cổng chặn thoái lui. Tính tất định vừa khôi phục xong rất dễ mất lại, và mất
# âm thầm — golden hash ghim cứng là thứ báo ngay.
#
# CHƯA ĐẨY LÊN REMOTE. Xem lại rồi tự push khi thấy ổn.
name: hardening

on:
  push:
    branches: [main, feat/ecological-selection, "hardening/**"]
  pull_request:

jobs:
  # Docs-only fast path (QD-FOCUS FOCUS-5, HARDENING-FASTPATH): reuse scripts/ci_docs_only.mjs so
  # hardening.yml and ci.yml share one definition of docs-only and one drift guard. Fail-safe: if
  # `scope` fails or is cancelled, `docs_only` is empty, `!= 'true'` holds, and `determinism` runs
  # in full. Pushes to main, feat/ecological-selection and hardening/** always run in full.
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the change (docs-only fast path)
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci_docs_only.mjs --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"

  determinism:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The pinned toolchain from rust-toolchain.toml, as ci.yml does, so the golden hash and the
      # stability runs use the same rustc as every other gate. `dtolnay/rust-toolchain@stable`
      # used to install the newest stable over the pin: STATE §1.h records rustc 1.100.0 here while
      # the Rust job ran the pinned 1.98.1.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Show toolchain
        working-directory: src-tauri
        run: |
          rustc --version --verbose
          cargo --version

      # Saved only from `main` and the trunk (2026-11-19). Saving from every pull request filled the
      # repository's 10 GB cache quota with one 667 MB copy per pull request (12 of 15 caches on
      # 2026-11-19), which pushes out the 1.6 GB Windows cache the Rust job needs. Same key rule as
      # ci.yml: toolchain file instead of the rust-environment hash.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          add-rust-environment-hash-key: false
          key: toolchain-${{ hashFiles('rust-toolchain.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/ecological-selection' }}

      # Tauri cần các thư viện hệ thống này trên Linux.
      - name: cài phụ thuộc hệ thống
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: test
        working-directory: src-tauri
        run: cargo test --release

      # Chạy lại 5 lần để bắt flaky. 20 lần là cổng ở máy local; trên CI thì 5
      # là đủ để bắt cái nào hỏng thường xuyên mà không đốt hết ngân sách runner.
      - name: kiểm ổn định (5 lần)
        working-directory: src-tauri
        run: |
          for i in 1 2 3 4 5; do
            RAYON_NUM_THREADS=1 cargo test --release --quiet \
              || { echo "::error::test khong on dinh o lan $i"; exit 1; }
          done

      # Chạy riêng để thông báo lỗi nói rõ nguyên nhân.
      - name: golden hash tất định
        working-directory: src-tauri
        run: |
          cargo test --release --test determinism_tests || {
            echo "::error::world_hash doi. Hai nguyen nhan: (1) sim mat tinh tat dinh -> di sua; (2) hanh vi sim doi co chu y -> cap nhat GOLDEN trong cung commit voi thay doi do."
            exit 1
          }

      - name: cấm thêm nguồn phi tất định vào src
        run: |
          hits=$(grep -rnE '(^|[^[:alnum:]_])(thread_rng|ThreadRng)([^[:alnum:]_]|$)|(^|[^[:alnum:]_])rand[[:space:]]*::[[:space:]]*rng([^[:alnum:]_]|$)' src-tauri/src src-tauri/crates --include='*.rs' \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' || true)
          if [ -n "$hits" ]; then
            n=$(printf '%s\n' "$hits" | wc -l | tr -d ' ')
            printf '%s\n' "$hits"
            echo "::error::co $n cho goi thread_rng() trong src. Dung SimRng hoac tham so rng."
            exit 1
          fi

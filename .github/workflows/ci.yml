name: CI

# Every gate is its own step so a run reports *which* gate failed rather than stopping at the first
# one. `if: ${{ !cancelled() }}` keeps later steps running after an earlier failure, which matters
# here because more than one gate is expected to be red while G0-G4 remediation is in progress.

on:
  # `main` only, not `['**']`. A branch with an open PR was matching both triggers and running the
  # whole workflow twice for one commit — including the Rust job, which builds wgpu, neo4j and the
  # WebSocket stack on a Windows runner and takes the better part of an hour. The two runs also
  # could not cancel each other: `concurrency.group` keys on `github.ref`, which is
  # `refs/heads/<branch>` for the push and `refs/pull/<n>/merge` for the pull_request, so they are
  # different groups by construction.
  #
  # The trade is real and worth stating: a branch with no PR open now gets no CI. Push it, open the
  # PR, and the same gates run — on the merge commit, which is the thing actually being merged.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (src-tauri)
    # Windows on purpose: this is the platform the project is developed and released on, and
    # src-tauri/.cargo/config.toml carries x86_64-pc-windows-msvc rustflags.
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            # cargo-audit and cargo-deny are `cargo install`ed below, which builds them from source —
            # several minutes each on a Windows runner. Caching the bin directory makes that a
            # first-run cost.
            ~/.cargo/bin
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        if: ${{ !cancelled() }}
        run: cargo fmt --check

      # Nothing checked Rust advisories before this. There were five, including gix-fs
      # RUSTSEC-2024-0350 (arbitrary code execution, CVSS 8.8) reachable through burn's `train`
      # feature. Three were cleared by `cargo update`; the `train` feature was dropped because
      # nothing here uses Burn's Learner harness, which took burn-dataset and gix out of the
      # compiled graph. src-tauri/.cargo/audit.toml documents the two that remain as lockfile-only
      # entries, with the commands that verify they are never built.
      - name: Install cargo-audit
        if: ${{ !cancelled() }}
        # `--locked` for a reproducible build of the tool itself. Skipped when the cache restored it.
        run: cargo install cargo-audit --locked || cargo audit --version

      - name: cargo audit
        if: ${{ !cancelled() }}
        run: cargo audit

      # OSS-012. `cargo audit` answers "is anything here vulnerable"; it cannot answer "what licenses
      # does this graph actually drag in, and is anything coming from a source nobody vetted". That
      # second question only became answerable once the project chose its own license (`MIT OR
      # Apache-2.0`, 2026-08-08) — before that there was no allow-list to check against.
      #
      # `src-tauri/deny.toml` carries the allow-list and the reasoning, including why the five MPL-2.0
      # crates are enumerated one by one instead of allowed wholesale.
      - name: Install cargo-deny
        if: ${{ !cancelled() }}
        run: cargo install cargo-deny --locked || cargo deny --version

      - name: cargo deny check
        if: ${{ !cancelled() }}
        run: cargo deny check

      - name: cargo clippy --all-targets -D warnings
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --features desktop -- -D warnings

      # G2 gate #2: a DEFAULT build must not compile the optional subsystems. Checking it here — not
      # just that it builds, but that the crates are absent from the dependency graph — is what stops
      # the gate from rotting the first time someone adds an unconditional `use`.
      - name: Default build excludes Neo4j, the WebSocket stack and Burn/WGPU
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo clippy --all-targets --no-default-features -- -D warnings
          leaked=$(cargo tree --no-default-features -e normal | grep -cE 'neo4rs|tokio-tungstenite|burn-wgpu|naga' || true)
          echo "gated crates present in a default build: $leaked"
          test "$leaked" -eq 0

      # G1.4 parity gate. ts-rs writes src/types/generated/ during `cargo test`; if a Rust IPC
      # struct changed without its TypeScript being regenerated, the working tree is dirty here and
      # this fails. That is the check that would have caught `head_directions` being a map on one
      # side and an array on the other.
      - name: TypeScript IPC bindings match the Rust structs
        if: ${{ !cancelled() }}
        run: |
          cargo test --lib export_bindings
          git diff --exit-code -- ../src/types/generated

      - name: cargo test
        if: ${{ !cancelled() }}
        # No GPU on the runner, so burn falls back to the ndarray CPU backend (ai/model.rs).
        env:
          ANIMA_USE_GPU: "0"
        shell: bash
        # `--nocapture` is here because without it a hang tells you nothing. This job died twice at
        # its timeout inside `persistence_stress_tests` (run 30190881586, both attempts) and the log
        # held exactly one useful line: the name of the target. libtest buffers a test's output and
        # prints it only when that test fails, so a target that never finishes prints nothing at all
        # — not even which test was in flight. Measured, because the reason mattered: with capture on,
        # `eprintln!` is swallowed from the test thread *and* from any thread it spawned; with
        # `--nocapture` both reach the log. That is what makes the `persistence_stress_tests` watchdog
        # able to report at all.
        #
        # It does not weaken the gate below. Measured on the full suite both ways: identical
        # `test targets: 56, empty: 0`, and identical counts of `Running` and anchored `running N
        # tests` lines, so `check_test_targets.mjs` parses the interleaved output exactly the same.
        #
        # Not added to the documented local command on purpose: unlike `--features desktop`, this
        # changes only what is *printed*, never what runs, so CI and local still execute the same
        # tests. Pass it yourself when you are chasing a hang.
        run: |
          set -o pipefail
          cargo test --features desktop -- --nocapture 2>&1 | tee ../cargo-test-output.txt

      # A test target that compiles but runs nothing exits 0, so `cargo test` alone cannot see it.
      # Seven files here are gated behind `networking`/`ml-wgpu`; under a default build every one
      # reports `running 0 tests` and passes. This asserts that does not happen for the feature set
      # CI actually runs, so an accidental gate — or a file emptied by a bad merge — is loud.
      - name: No test target ran zero tests
        if: ${{ !cancelled() }}
        run: node ../scripts/check_test_targets.mjs ../cargo-test-output.txt

      # The licensing artifacts run on THIS job, not the frontend one, because all of them read the
      # Rust graph with `cargo tree --features desktop` — and this is the job that has a toolchain
      # and a warm cargo cache. They also need `node_modules` to read each npm package's own
      # manifest and licence files, hence the install step below.
      #
      # `cargo tree` resolves for the HOST target, so these artifacts describe a Windows build. That
      # is why they run here and not on the ubuntu job: regenerating them there would produce a
      # different, equally correct, inventory and the freshness gates would report the runner rather
      # than the dependency graph.
      #
      # Measured 2026-07-27: 419 crates, 21 npm components with bytes in `dist/`, 18 installed but
      # not distributed — 458 total. (This comment previously said "419 crates and 45 npm packages";
      # 45 was never a measured number, and the npm figure was in any case counting the install
      # closure as though it were the ship closure.) The counts in the artifacts are derived, so
      # they cannot go stale the way this sentence did — but a stale artifact under-attributes
      # silently, which is what these four steps exist to prevent.
      - name: Install root dependencies (for the npm inventory)
        if: ${{ !cancelled() }}
        working-directory: .
        run: npm ci --no-audit --no-fund

      # Ordered so the most specific failure is reported first. The licence bundle is the artifact
      # that carries the actual obligation; NOTICE reports that bundle's coverage and would be
      # regenerated from a stale index if this ran second.
      - name: Third-party licence texts are current and complete
        if: ${{ !cancelled() }}
        working-directory: .
        run: npm run check:licenses

      - name: SBOM is current with the shipped dependency graph
        if: ${{ !cancelled() }}
        working-directory: .
        run: npm run check:sbom

      # Validates against the official CycloneDX 1.5 schema, vendored in `schemas/cyclonedx/` and
      # pinned to a specification commit with a SHA-256 per file. Nothing is fetched: a release gate
      # must not depend on a network round-trip, and a schema that can change without a commit here
      # is a gate whose meaning can change without review.
      - name: SBOM validates against the official CycloneDX 1.5 schema
        if: ${{ !cancelled() }}
        working-directory: .
        run: npm run check:sbom-schema

      - name: NOTICE is current with the shipped dependency graph
        if: ${{ !cancelled() }}
        working-directory: .
        run: npm run check:notice

      - name: Declared flora footprints match the real geometry
        if: ${{ !cancelled() }}
        working-directory: .
        run: npm run check:flora-footprint

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      # tests/ is a second npm package with its own lockfile and its own node_modules.
      - name: Install tests/ dependencies
        run: npm ci --prefix tests

      # Nothing checked dependency advisories before this. The two packages were carrying a critical
      # (vitest UI server: arbitrary file read and execute) and four high findings, all reachable
      # only by someone running `npm audit` by hand. `--audit-level=high` deliberately ignores
      # low/moderate: a gate that fires on every transitive moderate gets muted, and a muted gate is
      # worse than none.
      - name: npm audit (root)
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high

      - name: npm audit (tests)
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high --prefix tests

      # `scripts/gen_sbom.mjs` joined a package name to its version with a **literal NUL byte** typed
      # into the source. It worked, and it made git classify the file as binary — `git diff` showed
      # `Bin 7983 -> 7984 bytes` and nothing else, so every change to the licence and SBOM generator
      # was unreviewable and `grep` skipped it. It is invisible on screen too, because editors render
      # a control byte as a space.
      #
      # Cheap and near the top, because it explains a diff that otherwise looks empty.
      - name: No raw control bytes in tracked source
        if: ${{ !cancelled() }}
        run: npm run check:text-hygiene

      - name: E2 artifacts match the committed preregistration
        if: ${{ !cancelled() }}
        run: npm run check:e2

      - name: npm run lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: ESLint warning ratchet
        if: ${{ !cancelled() }}
        run: node scripts/eslint_ratchet.mjs

      # `npm run build` typechecks `src/` and `playground/` — the root tsconfig's `include` — and
      # nothing typechecked `tests/`. Vitest transpiles without checking, so the second npm package
      # had drifted to 86 type errors that no command in the repository would report: fixture arrays
      # missing fourteen required fields of `SegmentState`, three references to type names that do
      # not exist, `screen.getByTestId` overwritten with a function of the wrong signature. A mock
      # that does not typecheck is a mock that can disagree with the producer, which is the failure
      # mode the generated bindings exist to prevent.
      #
      # It runs before the suites on purpose: a shape error here explains a red test below.
      - name: Typecheck the tests/ package
        if: ${{ !cancelled() }}
        run: npm run typecheck:tests

      - name: npm run test (src suite)
        if: ${{ !cancelled() }}
        run: npm run test

      - name: npm run test:frontend (tests/ suite)
        if: ${{ !cancelled() }}
        run: npm run test:frontend

      - name: npm run build
        if: ${{ !cancelled() }}
        run: npm run build

      # These read `dist/`, so they run after the build and not before it. They existed as package
      # scripts and nothing invoked them — a script is not a gate until something fails on it.

      # The build writes `licensing/bundle-closure.json` from the real module graph, and that file
      # decides which npm components the licence artifacts treat as distributed. It is the one input
      # whose staleness is invisible: `check:notice`, `check:sbom` and `check:licenses` would all
      # keep passing against a boundary that had stopped being true, because each only compares
      # itself to itself.
      #
      # It runs on ubuntu while the licence artifacts are generated on Windows, which is deliberate:
      # the npm module graph does not depend on the OS, so agreement across the two runners is
      # additional evidence rather than a coincidence. If it ever does diverge — the most plausible
      # cause is rolldown embedding a different `@oxc-project/runtime` in a different platform
      # binding — this fails loudly and names the file, which is the outcome to want.
      - name: The committed npm distribution boundary matches a fresh build
        if: ${{ !cancelled() }}
        run: npm run check:bundle-closure

      - name: CSP compatibility of the shipped artifacts
        if: ${{ !cancelled() }}
        run: npm run check:csp

      # Byte budgets *and* the route split: `index.html` must not statically load the three.js
      # chunk. Measured with a real browser against `vite preview` (2026-07-27): the dashboard
      # fetches 17 JS files and none of them is that chunk; the landscape entry fetches it. A byte
      # ceiling alone would still pass if someone imported three into `App.tsx`.
      - name: Bundle budget and route split
        if: ${{ !cancelled() }}
        run: npm run check:bundle

      # Browser-scope E2E: zero fail, zero skip.
      #
      # This comment used to describe the specs as driving "a page-level Tauri IPC stub" needing no
      # release build, while the specs themselves spawned `target/release/anima-engine` and skipped
      # when it was absent. Both statements were in the repository at once and neither was checkable,
      # because the run was always green. It was the second that matched the code, and it did not
      # matter: the spawned process rendered into its own webview and Playwright drove an unrelated
      # Vite page, so nothing connected them and no IPC was exercised in either direction.
      #
      # What runs here now is the first description, made true. `tests/e2e/tauri-mock.ts` implements
      # the three functions `@tauri-apps/api` routes through, with fixed replies typed by the
      # generated `ts-rs` bindings, so the real frontend runs against a real transport. No binary,
      # no spawn, no skips — absent UI is a failure.
      #
      # The suite starts its own server on port 5177 (not 5173) with `reuseExistingServer: false`,
      # and `global-setup.ts` refuses to run unless the served page is actually Anima. That is not
      # hypothetical: on 2026-07-27 port 5173 on the development machine was held by an unrelated
      # project's Vite server, and the old config would have adopted it and reported the mismatch
      # as skips.
      #
      # Real-backend coverage is `tests/e2e/real_backend.spec.ts`, which declares no test unless
      # ANIMA_E2E_REQUIRE_BACKEND=1 and fails closed when it is set. Set it on this step only after
      # adding a `cargo build --release --features desktop` step AND a tauri-driver WebDriver
      # session; it fails, by design, without both.
      #
      # The canonical map view capture (`npm run capture:views`) is deliberately NOT here: it needs
      # a GPU, and on this runner it would fall back to SwiftShader — 0.27 fps against 46.7, and a
      # different rasteriser, so a different picture. CI verifies the committed PNGs instead, via
      # the checksums in map_manifest.json (tests/frontend/mapManifestEvidence.test.ts).
      - name: Install Playwright browsers
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium
        working-directory: tests

      - name: npm run test:e2e (Playwright)
        if: ${{ !cancelled() }}
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/test-results/
          retention-days: 7

      - name: Docs link check
        if: ${{ !cancelled() }}
        run: node scripts/check_docs_links.mjs

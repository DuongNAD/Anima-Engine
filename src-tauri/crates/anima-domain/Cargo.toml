[package]
name = "anima-domain"
version = "0.1.0"
edition = "2021"
description = "World laws, transactions and provenance, independent of any engine adapter."

# Deliberately minimal. This crate is the shared core the headless runner and the live Bevy world
# are both meant to be adapters over (G2 task 1), so anything that ties it to one of them —
# bevy_ecs, tauri, burn — does not belong here. If a dependency is about to be added, that is the
# moment to ask whether the type being added is really a world law.
[dependencies]
serde = { version = "1.0", features = ["derive"] }

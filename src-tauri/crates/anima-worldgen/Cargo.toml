[package]
name = "anima-worldgen"
version = "0.1.0"
edition = "2021"
description = "Deterministic World v2 geomorphic generator, ANMW v3 codec, and offline bake pipeline."
license.workspace = true
repository.workspace = true

# Strictly zero default dependencies (G2 gate): downstream crates that only read metadata or
# constants pay zero compile cost unless they explicitly opt into `reader`, `generate`, or `bake`.
[dependencies]
bytemuck = { version = "1.25", default-features = false, optional = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"], optional = true }
futures-executor = { version = "0.3", optional = true }
libm = { version = "0.2", optional = true }
rand = { version = "0.8", optional = true }
rand_chacha = { version = "0.3", optional = true }
rayon = { version = "1.10", optional = true }
tar = { version = "0.4", default-features = false, optional = true }
wgpu = { version = "30.0.2", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sha2 = { version = "0.10", optional = true }
toml = { version = "0.8", default-features = false, features = ["parse"], optional = true }

[features]
default = []
# Minimal ANMW v3 reader surface (added to engine in WV2-3; no C deps, no generator/bake deps).
reader = ["dep:sha2"]
# Offline deterministic generator (libm-only transcendentals + ChaCha12 + rayon).
generate = [
    "reader",
    "dep:libm",
    "dep:rand",
    "dep:rand_chacha",
    "dep:rayon",
    "dep:serde",
    "dep:serde_json",
    "dep:toml",
]
# Offline tile, fields, CPU horizon lighting, flora, KTX2/BC5, and asset LOD/impostor pipeline.
bake = ["generate", "dep:bytemuck", "dep:flate2", "dep:tar"]
# Optional GPU compute path (pins wgpu 30.0.2 matching Cargo.lock; never enabled by desktop).
gpu-bake = ["bake", "dep:wgpu", "dep:futures-executor"]

[[bin]]
name = "anima-worldgen"
path = "src/bin/anima-worldgen.rs"
required-features = ["generate"]

[[bin]]
name = "anima-bake"
path = "src/bin/anima-bake.rs"
required-features = ["bake"]

[[test]]
name = "wv2_1a_tectonic_tests"
required-features = ["generate"]

[[test]]
name = "wv2_1b_solver_hydro_tests"
required-features = ["generate"]

[[test]]
name = "wv2_2_climate_biome_cave_tests"
required-features = ["generate"]

[[test]]
name = "wv2_4_g_shape_comp_tests"
required-features = ["generate"]

[[test]]
name = "wv2_5_bake_tests"
required-features = ["bake"]

[[test]]
name = "wv2_5_gpu_bake_tests"
required-features = ["gpu-bake"]

[[example]]
name = "wv2_2_release_verify"
required-features = ["reader", "generate", "bake"]
